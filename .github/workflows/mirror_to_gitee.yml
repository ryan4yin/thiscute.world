name: Mirror this repo to Gitee
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Mirror repo to Gitee
        shell: bash
        env:
          INPUT_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_GITEE_MIRROR }}
          INPUT_TARGET_REPO_URL: git@gitee.com:ryan_yin/thiscute.world.git
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$INPUT_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          # StrictHostKeyChecking=yes rejects unknown hosts; pin the current keys at runtime.
          ssh-keyscan -H gitee.com >> "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git remote add mirror "$INPUT_TARGET_REPO_URL"

          git push --force mirror "refs/remotes/origin/main:refs/heads/main"
          git push --force --tags mirror
