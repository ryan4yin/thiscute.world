# based on https://github.com/peaceiris/actions-hugo
name: update & deploy

on:
  push:
    branches:
      - main
  # schedule:
  # - cron: "36 5 * * *"  # 分 时 日 月 周

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive # Fetch Hugo themes recursively
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
          lfs: true # download Git-LFS files

      - name: Use Python3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install Python dependencies
        run: python3 -m pip install --no-cache-dir -r requirements.txt

      - name: Decrypt service account
        continue-on-error: true
        run: |
          gpg --quiet --batch --yes --decrypt \
            --passphrase="$SERVICE_ACCOUNT_DECRYPT_KEY" \
            --output google-service-account.json google-service-account.json.gpg
        env:
          SERVICE_ACCOUNT_DECRYPT_KEY: ${{ secrets.SERVICE_ACCOUNT_DECRYPT_KEY }}

      - name: Update website statistics
        continue-on-error: true
        run: python3 update_statistics.py

      - name: Update post counts
        continue-on-error: true
        run: python3 process_posts.py --stats-only

      - name: Commit Changes
        continue-on-error: true
        run: |
          git config --local user.email "ryan4yin[bot]@users.noreply.github.com"
          git config --local user.name "ryan4yin[bot]"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "feat: update data/"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Clean temporary credentials
        if: always()
        run: git clean -fxd

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.165.0"
          extended: true #  need extended version to support SASS/SCSS

      - name: Build
        run: hugo --minify --printUnusedTemplates --logLevel=debug

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: thiscute.world

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Push Algolia Index
        run: node push_argolia_index.js
        env:
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
